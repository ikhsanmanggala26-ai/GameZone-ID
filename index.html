    <!-- Modul Sinkronisasi Cloud Backend & Google Apps Script -->
    <script>
        (async function bootstrapCloudBackend() {
            window.CloudBackend = {
                enabled: false,
                ready: false,
                db: null,
                auth: null,
                appId: typeof __app_id !== 'undefined' ? __app_id : 'default-app-id',
                docRef: null,
                chatColRef: null,
                isApplyingRemote: false,
                syncTimer: null,
                _fs: null,

                async init() {
                    try {
                        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                            return;
                        }
                        const [
                            { initializeApp },
                            { getAuth, signInAnonymously, signInWithCustomToken },
                            { getFirestore, doc, setDoc, onSnapshot, collection }
                        ] = await Promise.all([
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
                            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
                        ]);

                        this._fs = { doc, setDoc };
                        const cfg = JSON.parse(__firebase_config);
                        const app = initializeApp(cfg);
                        this.auth = getAuth(app);
                        this.db = getFirestore(app);

                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(this.auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(this.auth);
                        }

                        if (!this.auth.currentUser) return;

                        this.enabled = true;
                        this.docRef = doc(this.db, 'artifacts', this.appId, 'public', 'data', 'portal_state', 'main');
                        this.chatColRef = collection(this.db, 'artifacts', this.appId, 'public', 'data', 'chat_messages');

                        onSnapshot(this.docRef, (snap) => {
                            if (snap.exists()) {
                                const remote = snap.data();
                                if (remote && remote.payload) {
                                    this.isApplyingRemote = true;
                                    try {
                                        const parsed = JSON.parse(remote.payload);
                                        if (typeof window.applyRemotePortalState === 'function') {
                                            window.applyRemotePortalState(parsed);
                                        }
                                    } catch (err) {
                                        console.error('[CloudBackend] Parse error:', err);
                                    } finally {
                                        this.isApplyingRemote = false;
                                    }
                                }
                            } else {
                                this.pushStateNow();
                            }
                            if (!this.ready) {
                                this.ready = true;
                                if (typeof window.renderApp === 'function') window.renderApp();
                            }
                        }, (err) => {
                            console.error('[CloudBackend] State listener error:', err);
                        });

                        onSnapshot(this.chatColRef, (snap) => {
                            const remoteChats = [];
                            snap.forEach((d) => {
                                remoteChats.push(d.data());
                            });
                            if (remoteChats.length > 0 && typeof window.applyRemoteChatMessages === 'function') {
                                remoteChats.sort((a, b) => (a.createdTs || 0) - (b.createdTs || 0));
                                window.applyRemoteChatMessages(remoteChats);
                            }
                        }, (err) => {
                            console.error('[CloudBackend] Chat listener error:', err);
                        });
                    } catch (err) {
                        console.warn('[CloudBackend] Berjalan dalam mode offline/lokal:', err);
                    }
                },

                schedulePushState() {
                    if (!this.enabled || this.isApplyingRemote) return;
                    clearTimeout(this.syncTimer);
                    this.syncTimer = setTimeout(() => this.pushStateNow(), 450);
                },

                async pushStateNow() {
                    if (!this.enabled || !this.docRef || !this._fs || !window.state) return;
                    try {
                        const clone = JSON.parse(JSON.stringify(window.state));
                        delete clone.currentUserId;
                        await this._fs.setDoc(this.docRef, {
                            payload: JSON.stringify(clone),
                            updatedAt: Date.now()
                        }, { merge: true });
                    } catch (err) {
                        console.error('[CloudBackend] Push state error:', err);
                    }
                },

                async pushChatMessage(msg) {
                    if (!this.enabled || !this.db || !this._fs || !msg || !msg.id) return;
                    try {
                        const msgRef = this._fs.doc(this.db, 'artifacts', this.appId, 'public', 'data', 'chat_messages', msg.id);
                        await this._fs.setDoc(msgRef, {
                            ...msg,
                            createdTs: msg.createdTs || Date.now()
                        }, { merge: true });
                    } catch (err) {
                        console.error('[CloudBackend] Push chat error:', err);
                    }
                }
            };

            await window.CloudBackend.init();
        })();

        // =========================================================================
        // MODUL KONEKTOR GOOGLE APPS SCRIPT + GOOGLE SHEETS (ANTI-LOOP & ANTI-FLICKER)
        // =========================================================================
        window.AppsScriptBackend = {
            pollTimer: null,
            syncTimer: null,
            isSyncing: false,
            lastStatus: 'idle',
            lastRemoteHash: '',

            getUrl() {
                return (window.state && window.state.siteSettings && window.state.siteSettings.appsScriptUrl)
                    ? window.state.siteSettings.appsScriptUrl.trim()
                    : '';
            },

            isEnabled() {
                const url = this.getUrl();
                return Boolean(url && url.startsWith('https://script.google.com/'));
            },

            start() {
                if (this.pollTimer) clearInterval(this.pollTimer);
                if (!this.isEnabled()) return;
                this.pollTimer = setInterval(() => this.pullNow(true), 15000);
            },

            schedulePushState() {
                if (!this.isEnabled()) return;
                clearTimeout(this.syncTimer);
                this.syncTimer = setTimeout(() => this.pushStateNow(), 700);
            },

            async pushStateNow() {
                const url = this.getUrl();
                if (!this.isEnabled() || !window.state) return;
                try {
                    const clone = JSON.parse(JSON.stringify(window.state));
                    delete clone.currentUserId;
                    const serialized = JSON.stringify(clone);
                    this.lastRemoteHash = serialized;
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveState',
                            payload: serialized
                        })
                    });
                    this.lastStatus = 'connected';
                } catch (err) {
                    console.error('[AppsScriptBackend] Push state error:', err);
                    this.lastStatus = 'error';
                }
            },

            async pushChatMessage(msg) {
                const url = this.getUrl();
                if (!this.isEnabled() || !msg) return;
                try {
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'pushChat',
                            message: msg
                        })
                    });
                } catch (err) {
                    console.error('[AppsScriptBackend] Push chat error:', err);
                }
            },

            async pullNow(silent = false) {
                const url = this.getUrl();
                if (!this.isEnabled() || this.isSyncing) return;
                const activeTag = document.activeElement ? document.activeElement.tagName : '';
                if (silent && (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT')) {
                    return;
                }
                this.isSyncing = true;
                try {
                    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now());
                    const data = await res.json();
                    if (data && data.ok) {
                        this.lastStatus = 'connected';
                        if (data.statePayload && typeof window.applyRemotePortalState === 'function') {
                            if (data.statePayload !== this.lastRemoteHash) {
                                this.lastRemoteHash = data.statePayload;
                                const parsed = JSON.parse(data.statePayload);
                                if (parsed && parsed.siteSettings) {
                                    parsed.siteSettings.appsScriptUrl = url;
                                }
                                window.applyRemotePortalState(parsed);
                            }
                        }
                        if (Array.isArray(data.chats) && data.chats.length > 0 && typeof window.applyRemoteChatMessages === 'function') {
                            data.chats.sort((a, b) => (a.createdTs || 0) - (b.createdTs || 0));
                            window.applyRemoteChatMessages(data.chats);
                        }
                        if (!silent && typeof showToast === 'function') {
                            showToast('Sinkronisasi Google Sheets berhasil (HTTP 200 OK)!', 'success');
                        }
                    }
                } catch (err) {
                    console.error('[AppsScriptBackend] Pull error:', err);
                    this.lastStatus = 'error';
                    if (!silent && typeof showToast === 'function') {
                        showToast('Gagal terhubung ke Google Apps Script. Pastikan akses Web App diatur ke "Anyone".', 'error');
                    }
                } finally {
                    this.isSyncing = false;
                }
            }
        };
    </script>

        function ensurePerGameWalletsAndPackages(targetState) {
            if (!targetState) return;
            if (!Array.isArray(targetState.users) || targetState.users.length === 0) {
                targetState.users = createDefaultState().users;
            }
            const hasAdmin = targetState.users.some(u => u && (u.role === 'admin' || u.id === 'u-admin'));
            if (!hasAdmin) {
                targetState.users.unshift(createDefaultState().users[0]);
            }
            if (!Array.isArray(targetState.games)) return;
            targetState.games.forEach(g => {
                if (!g.coinName) g.coinName = 'Koin ' + g.title;
                if (typeof g.playCost !== 'number') g.playCost = 0;

                if (Array.isArray(targetState.users)) {
                    targetState.users.forEach(u => {
                        if (!u.gameWallets || typeof u.gameWallets !== 'object') {
                            u.gameWallets = {};
                        }
                        if (typeof u.gameWallets[g.id] !== 'number') {
                            u.gameWallets[g.id] = 0;
                        }
                    });
                }

                if (targetState.topupConfig && Array.isArray(targetState.topupConfig.packages)) {
                    const hasPkg = targetState.topupConfig.packages.some(p => p.gameId === g.id);
                    if (!hasPkg) {
                        targetState.topupConfig.packages.push({
                            id: 'pkg-' + g.id + '-starter',
                            gameId: g.id,
                            name: 'Starter ' + g.coinName,
                            coins: 100,
                            bonus: 15,
                            price: 10000,
                            tag: 'Baru'
                        });
                    }
                }
            });
        }

        function loadState() {
            const def = createDefaultState();
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    ensurePerGameWalletsAndPackages(def);
                    return def;
                }
                const parsed = JSON.parse(raw);
                const merged = {
                    ...def,
                    ...parsed,
                    siteSettings: { ...def.siteSettings, ...(parsed.siteSettings || {}) },
                    topupConfig: {
                        ...def.topupConfig,
                        ...(parsed.topupConfig || {}),
                        paymentGateway: {
                            ...def.topupConfig.paymentGateway,
                            ...((parsed.topupConfig && parsed.topupConfig.paymentGateway) || {})
                        }
                    },
                    pageContents: {
                        home: { ...def.pageContents.home, ...((parsed.pageContents && parsed.pageContents.home) || {}) },
                        games: { ...def.pageContents.games, ...((parsed.pageContents && parsed.pageContents.games) || {}) },
                        leaderboard: { ...def.pageContents.leaderboard, ...((parsed.pageContents && parsed.pageContents.leaderboard) || {}) },
                        topup: { ...def.pageContents.topup, ...((parsed.pageContents && parsed.pageContents.topup) || {}) }
                    }
                };
                ensurePerGameWalletsAndPackages(merged);
                return merged;
            } catch (err) {
                ensurePerGameWalletsAndPackages(def);
                return def;
            }
        }

        let state = loadState();
        window.state = state;

        function saveState() {
            ensurePerGameWalletsAndPackages(state);

            if (window.CloudBackend && typeof window.CloudBackend.schedulePushState === 'function') {

            const merged = Array.from(map.values()).sort((a, b) => (a.createdTs || 0) - (b.createdTs || 0));

            const icons = {

            const el = document.createElement('div');
            el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-md text-xs font-medium animate-fade-in ${colors[type] || colors.info}`;

        function copyText(text, label = 'Teks') {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast(`${label} berhasil disalin!`, 'success');
            } catch (e) {
                showToast(`Gagal menyalin ${label}.`, 'error');
            }
        }

        function compressImageFile(file, maxWidth = 512, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width;
                    let h = img.height;
                    if (w > maxWidth) {
                        h = Math.round((h * maxWidth) / w);
                        w = maxWidth;
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                    callback(dataUrl);
                };
                img.onerror = function() {
                    callback(e.target.result);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // =========================================================================
        function syncAllUsersPresence() {
            const now = Date.now();
            let changed = false;
            state.users.forEach(u => {
                if (u.id === state.currentUserId) {
                    const elapsed = now - (u.lastActiveAt || now);
                    const target = elapsed >= IDLE_TIMEOUT_MS ? 'idle' : 'online';
                    if (u.presenceStatus !== target) {
                        u.presenceStatus = target;
                        changed = true;
                    }
                } else if (u.presenceStatus !== 'offline') {
                    u.presenceStatus = 'offline';
                    changed = true;
                }
            });
            if (changed) saveState();
        }

        function recordUserActivity() {
            const user = getCurrentUser();
            if (!user) return;
            const wasIdle = user.presenceStatus === 'idle';
            user.lastActiveAt = Date.now();
            if (wasIdle) {
                user.presenceStatus = 'online';
                saveState();
                renderApp();
            }
        }

        function checkPortalIdleStatus() {
            const user = getCurrentUser();
            if (!user) return;
            const elapsed = Date.now() - (user.lastActiveAt || Date.now());
            if (elapsed >= IDLE_TIMEOUT_MS && user.presenceStatus !== 'idle') {
                user.presenceStatus = 'idle';
                saveState();
                renderApp();
            }
        }

        function startGame(gameId) {
            const game = state.games.find(g => g.id === gameId);
            if (!game) return;
            const user = getCurrentUser();
            const playCost = Number(game.playCost || 0);
            const coinLabel = game.coinName || ('Koin ' + game.title);

            if (playCost > 0) {
                if (!user) {
                    showToast(`Game ini membutuhkan tiket ${playCost} ${coinLabel}. Silakan masuk akun terlebih dahulu.`, 'warning');
                    openAuthModal('login');
                    return;
                }
                const currentBal = getUserGameCoins(user, game.id);
                if (currentBal < playCost) {
                    showToast(`Saldo ${coinLabel} kamu (${currentBal}) tidak mencukupi tiket masuk (${playCost} ${coinLabel}). Silakan Top-Up!`, 'error');
                    navigateTo('topup', game.id);
                    return;
                }
                user.gameWallets[game.id] = currentBal - playCost;
                showToast(`Tiket masuk -${playCost} ${coinLabel} terpotong. Selamat bermain!`, 'info');

            game.plays = Number(game.plays || 0) + 1;
            saveState();
            navigateTo('play', gameId);

                    ${Array.isArray(game.detectedItems) && game.detectedItems.length > 0 ? `

                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                ${game.detectedItems.map(it => `
                                    <div class="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-3">
                                        <div class="min-w-0">
                                            <div class="text-xs font-extrabold text-white truncate">${escapeHtml(it.name)}</div>
                                            ${it.description ? `<div class="text-[10px] text-slate-400 truncate">${escapeHtml(it.description)}</div>` : ''}
                                            <div class="text-xs font-bold text-amber-400 mt-1">${Number(it.price || 0).toLocaleString('id-ID')} ${escapeHtml(coinLabel)}</div>
                                        </div>
                                        <button type="button" onclick="purchaseDetectedGameItem('${game.id}', '${escapeHtml(it.id)}')"
                                            class="px-3 py-2 rounded-xl ${theme.btnPrimary} text-xs font-bold shrink-0">
                                            Beli
                                        </button>
                                    </div>
                                `).join('')}

                        </div>
                    ` : ''}
                </div>
            `;

        function mountActiveGameEngine() {
            const game = state.games.find(g => g.id === ui.activeGameId) || state.games[0];
            if (!game || game.type === 'embed') return;
            const mount = document.getElementById('builtinGameMount');
            if (!mount) return;

            if (game.builtinKey === 'snake') initSnakeGame(mount, game);
            else if (game.builtinKey === 'memory') initMemoryGame(mount, game);
            else if (game.builtinKey === 'reflex') initReflexGame(mount, game);
            else if (game.builtinKey === 'asteroid') initAsteroidGame(mount, game);
            else initSnakeGame(mount, game);
        }

        function claimGameReward(gameId, score) {
            const game = state.games.find(g => g.id === gameId);
            if (!game) return;
            const user = getCurrentUser();
            const coinLabel = game.coinName || ('Koin ' + game.title);
            const reward = Number(game.coinReward || 0);
            const numScore = Number(score || 0);

            if (!user) {
                showToast(`Skor ${numScore}! Masuk akun untuk menyimpan skor & klaim +${reward} ${coinLabel}.`, 'warning');
                return;
            }

            if (!user.gameWallets) user.gameWallets = {};
            user.gameWallets[game.id] = Number(user.gameWallets[game.id] || 0) + reward;

            if (numScore > 0) {
                state.leaderboard.push({
                    id: 'lb-' + Date.now(),
                    gameId: game.id,
                    userId: user.id,
                    userName: user.name,
                    score: numScore,
                    date: new Date().toISOString().slice(0, 10)
                });
            }

            saveState();
            showToast(`Selamat! Skor ${numScore} tercatat & +${reward} ${coinLabel} ditambahkan!`, 'success');
            renderApp();
        }

        function purchaseDetectedGameItem(gameId, itemId) {
            const game = state.games.find(g => g.id === gameId);
            if (!game || !Array.isArray(game.detectedItems)) return;
            const item = game.detectedItems.find(x => String(x.id) === String(itemId));
            if (!item) return;

            const user = getCurrentUser();
            const coinLabel = game.coinName || ('Koin ' + game.title);
            if (!user) {
                showToast(`Masuk akun terlebih dahulu untuk membeli item memakai ${coinLabel}.`, 'warning');
                openAuthModal('login');
                return;
            }

            const cost = Number(item.price || 0);
            const currentBal = getUserGameCoins(user, game.id);
            if (currentBal < cost) {
                showToast(`Saldo ${coinLabel} kamu (${currentBal}) tidak cukup untuk membeli ${item.name} (${cost}).`, 'error');
                return;
            }

            user.gameWallets[game.id] = currentBal - cost;
            saveState();

            const iframe = document.getElementById('activeGameIframe');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    source: 'GameZonePortal',
                    type: 'ITEM_GRANTED',
                    gameId: game.id,
                    itemId: item.id,
                    itemName: item.name,
                    remainingCoins: user.gameWallets[game.id]
                }, '*');
            }

            showToast(`Berhasil membeli "${item.name}" (-${cost} ${coinLabel})!`, 'success');
            renderApp();
        }

        // --- MINI-GAME 1: NEON SNAKE CYBER ---
        function initSnakeGame(mount, game) {
            mount.innerHTML = `
                <div class="flex flex-col items-center space-y-4">
                    <div class="w-full max-w-md flex items-center justify-between text-xs font-bold">
                        <span class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-emerald-400">Skor: <span id="snakeScore">0</span></span>
                        <button type="button" id="snakeRestartBtn" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white">Mulai Ulang</button>
                    </div>
                    <div class="w-full max-w-md aspect-square rounded-2xl overflow-hidden border-2 border-emerald-500/30 bg-slate-950 relative">
                        <canvas id="snakeCanvas" class="game-canvas"></canvas>
                    </div>
                    <div class="grid grid-cols-3 gap-2 w-44 sm:hidden">
                        <div></div>
                        <button type="button" onclick="setSnakeDir(0,-1)" class="p-3 rounded-xl bg-slate-800 text-white"><i class="fa-solid fa-arrow-up"></i></button>
                        <div></div>
                        <button type="button" onclick="setSnakeDir(-1,0)" class="p-3 rounded-xl bg-slate-800 text-white"><i class="fa-solid fa-arrow-left"></i></button>
                        <button type="button" onclick="setSnakeDir(0,1)" class="p-3 rounded-xl bg-slate-800 text-white"><i class="fa-solid fa-arrow-down"></i></button>
                        <button type="button" onclick="setSnakeDir(1,0)" class="p-3 rounded-xl bg-slate-800 text-white"><i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                    <p class="text-[11px] text-slate-400">Gunakan tombol Panah / WASD (atau tombol arah di layar sentuh).</p>
                </div>
            `;

            const canvas = document.getElementById('snakeCanvas');
            const ctx = canvas.getContext('2d');
            const gridCount = 20;
            let snake = [{ x: 10, y: 10 }];
            let dir = { x: 1, y: 0 };
            let nextDir = { x: 1, y: 0 };
            let food = { x: 15, y: 10 };
            let score = 0;
            let gameOver = false;

            function resizeCanvas() {
                if (!canvas || !canvas.parentElement) return;
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width || 360;
                canvas.height = rect.height || 360;
                draw();
            }

            function spawnFood() {
                let candidate;
                let attempts = 0;
                do {
                    candidate = {
                        x: Math.floor(Math.random() * gridCount),
                        y: Math.floor(Math.random() * gridCount)
                    };
                    attempts++;
                } while (snake.some(seg => seg.x === candidate.x && seg.y === candidate.y) && attempts < 200);
                food = candidate;
            }

            window.setSnakeDir = function(dx, dy) {
                if (dx === -dir.x && dy === -dir.y) return;
                nextDir = { x: dx, y: dy };
            };

            function onKeyDown(e) {
                if (e.shiftKey && e.key === 'Tab') return;
                if (['ArrowUp', 'w', 'W'].includes(e.key)) { e.preventDefault(); window.setSnakeDir(0, -1); }
                if (['ArrowDown', 's', 'S'].includes(e.key)) { e.preventDefault(); window.setSnakeDir(0, 1); }
                if (['ArrowLeft', 'a', 'A'].includes(e.key)) { e.preventDefault(); window.setSnakeDir(-1, 0); }
                if (['ArrowRight', 'd', 'D'].includes(e.key)) { e.preventDefault(); window.setSnakeDir(1, 0); }
            }

            function draw() {
                if (!canvas || !ctx) return;
                const cell = canvas.width / gridCount;
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#0f172a';
                for (let i = 0; i <= gridCount; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cell, 0);
                    ctx.lineTo(i * cell, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * cell);
                    ctx.lineTo(canvas.width, i * cell);
                    ctx.stroke();
                }

                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.38, 0, Math.PI * 2);
                ctx.fill();

                snake.forEach((seg, idx) => {
                    ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
                    ctx.fillRect(seg.x * cell + 1.5, seg.y * cell + 1.5, cell - 3, cell - 3);
                });

                if (gameOver) {
                    ctx.fillStyle = 'rgba(2,6,23,0.82)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 20px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Game Over! Skor: ' + score, canvas.width / 2, canvas.height / 2 - 10);
                    ctx.font = '13px Inter, sans-serif';
                    ctx.fillStyle = '#fbbf24';
                    ctx.fillText('Klik "Mulai Ulang" untuk main lagi', canvas.width / 2, canvas.height / 2 + 18);
                }
            }

            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const loop = setInterval(() => {
                if (gameOver) {
                    draw();
                    return;
                }
                dir = nextDir;
                const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
                if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount || snake.some(s => s.x === head.x && s.y === head.y)) {
                    gameOver = true;
                    draw();
                    if (score > 0) claimGameReward(game.id, score);
                    return;
                }
                snake.unshift(head);
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    const scEl = document.getElementById('snakeScore');
                    if (scEl) scEl.textContent = score;
                    spawnFood();
                } else {
                    snake.pop();
                }
                draw();
            }, 130);

            document.getElementById('snakeRestartBtn').onclick = () => {
                snake = [{ x: 10, y: 10 }];
                dir = { x: 1, y: 0 };
                nextDir = { x: 1, y: 0 };
                score = 0;
                gameOver = false;
                const scEl = document.getElementById('snakeScore');
                if (scEl) scEl.textContent = '0';
                spawnFood();
                draw();
            };

            spawnFood();
            draw();

            activeGameCleanup = () => {
                clearInterval(loop);
                window.removeEventListener('keydown', onKeyDown);
                window.removeEventListener('resize', resizeCanvas);
            };
        }

        // --- MINI-GAME 2: MEMORY CARD MATCH ---
        function initMemoryGame(mount, game) {
            const icons = ['fa-gamepad', 'fa-trophy', 'fa-rocket', 'fa-bolt', 'fa-crown', 'fa-dragon', 'fa-gem', 'fa-fire'];
            let deck = [...icons, ...icons]
                .sort(() => Math.random() - 0.5)
                .map((icon, idx) => ({ id: idx, icon, flipped: false, matched: false }));
            let flippedIndices = [];
            let moves = 0;
            let seconds = 0;
            let locked = false;
            let completed = false;

            mount.innerHTML = `
                <div class="max-w-md mx-auto space-y-4">
                    <div class="flex items-center justify-between text-xs font-bold">
                        <span class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-indigo-300">Langkah: <span id="memMoves">0</span></span>
                        <span class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-amber-300">Waktu: <span id="memTime">0</span>d</span>
                        <button type="button" id="memResetBtn" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white">Acak Ulang</button>
                    </div>
                    <div id="memGrid" class="grid grid-cols-4 gap-3"></div>
                </div>
            `;

            const timer = setInterval(() => {
                if (!completed) {
                    seconds++;
                    const tEl = document.getElementById('memTime');
                    if (tEl) tEl.textContent = seconds;
                }
            }, 1000);

            function renderGrid() {
                const grid = document.getElementById('memGrid');
                if (!grid) return;
                grid.innerHTML = deck.map((card, i) => `
                    <button type="button" onclick="flipMemoryCard(${i})"
                        class="aspect-square rounded-2xl border text-2xl flex items-center justify-center transition ${card.matched ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : card.flipped ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-950 border-slate-800 hover:border-slate-700 text-slate-600'}">
                        <i class="fa-solid ${card.flipped || card.matched ? card.icon : 'fa-question'}"></i>
                    </button>
                `).join('');
            }

            window.flipMemoryCard = function(idx) {
                if (locked || completed) return;
                const card = deck[idx];
                if (!card || card.flipped || card.matched) return;
                card.flipped = true;
                flippedIndices.push(idx);
                renderGrid();

                if (flippedIndices.length === 2) {
                    moves++;
                    const mEl = document.getElementById('memMoves');
                    if (mEl) mEl.textContent = moves;
                    locked = true;
                    const [a, b] = flippedIndices;
                    if (deck[a].icon === deck[b].icon) {
                        deck[a].matched = true;
                        deck[b].matched = true;
                        flippedIndices = [];
                        locked = false;
                        renderGrid();
                        if (deck.every(c => c.matched)) {
                            completed = true;
                            clearInterval(timer);
                            const finalScore = Math.max(50, 300 - moves * 5 - seconds);
                            claimGameReward(game.id, finalScore);
                        }
                    } else {
                        setTimeout(() => {
                            deck[a].flipped = false;
                            deck[b].flipped = false;
                            flippedIndices = [];
                            locked = false;
                            renderGrid();
                        }, 650);
                    }
                }
            };

            document.getElementById('memResetBtn').onclick = () => {
                clearInterval(timer);
                initMemoryGame(mount, game);
            };

            renderGrid();
            activeGameCleanup = () => clearInterval(timer);
        }

        // --- MINI-GAME 3: AIM REFLEX ARENA ---
        function initReflexGame(mount, game) {
            let score = 0;
            let timeLeft = 30;
            let running = true;

            mount.innerHTML = `
                <div class="max-w-lg mx-auto space-y-4">
                    <div class="flex items-center justify-between text-xs font-bold">
                        <span class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-rose-400">Skor: <span id="refScore">0</span></span>
                        <span class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-amber-300">Sisa Waktu: <span id="refTime">30</span>d</span>
                        <button type="button" id="refResetBtn" class="px-3.5 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white">Ulangi</button>
                    </div>
                    <div id="refArena" class="relative w-full h-80 rounded-2xl bg-slate-950 border-2 border-rose-500/30 overflow-hidden select-none">
                        <button type="button" id="refTarget" onclick="hitReflexTarget()"
                            style="left: 45%; top: 45%;"
                            class="absolute -translate-x-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-gradient-to-br from-rose-500 to-amber-500 text-white shadow-lg shadow-rose-500/40 flex items-center justify-center text-lg active:scale-90 transition-transform">
                            <i class="fa-solid fa-crosshairs"></i>
                        </button>
                    </div>
                </div>
            `;

            window.hitReflexTarget = function() {
                if (!running) return;
                score += 15;
                const scEl = document.getElementById('refScore');
                if (scEl) scEl.textContent = score;
                const target = document.getElementById('refTarget');
                if (target) {
                    const x = 12 + Math.random() * 76;
                    const y = 14 + Math.random() * 72;
                    target.style.left = x + '%';

                }
            };

            const timer = setInterval(() => {
                if (!running) return;
                timeLeft--;
                const tEl = document.getElementById('refTime');
                if (tEl) tEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    running = false;
                    clearInterval(timer);
                    const arena = document.getElementById('refArena');
                    if (arena) {
                        arena.innerHTML = `
                            <div class="w-full h-full flex flex-col items-center justify-center text-center p-4 space-y-2">
                                <div class="text-2xl font-black text-white">Waktu Habis!</div>
                                <div class="text-sm text-amber-400 font-bold">Total Skor: ${score}</div>
                            </div>
                        `;
                    }
                    if (score > 0) claimGameReward(game.id, score);
                }
            }, 1000);

            document.getElementById('refResetBtn').onclick = () => {
                clearInterval(timer);
                initReflexGame(mount, game);
            };

            activeGameCleanup = () => clearInterval(timer);
        }

        // --- MINI-GAME 4: SPACE ASTEROID DODGE ---
        function initAsteroidGame(mount, game) {
            mount.innerHTML = `
                <div class="flex flex-col items-center space-y-4">
                    <div class="w-full max-w-md flex items-center justify-between text-xs font-bold">
                        <span class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-cyan-400">Skor: <span id="astScore">0</span></span>
                        <button type="button" id="astResetBtn" class="px-3.5 py-1.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white">Mulai Ulang</button>
                    </div>
                    <div class="w-full max-w-md h-80 rounded-2xl overflow-hidden border-2 border-cyan-500/30 bg-slate-950">
                        <canvas id="astCanvas" class="game-canvas"></canvas>
                    </div>
                    <div class="flex items-center gap-4 sm:hidden">
                        <button type="button" onclick="moveAsteroidPlayer(-28)" class="px-6 py-3 rounded-xl bg-slate-800 text-white font-bold"><i class="fa-solid fa-arrow-left"></i> Kiri</button>
                        <button type="button" onclick="moveAsteroidPlayer(28)" class="px-6 py-3 rounded-xl bg-slate-800 text-white font-bold">Kanan <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('astCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth || 380;
            canvas.height = canvas.parentElement.clientHeight || 320;

            let shipX = canvas.width / 2;
            let asteroids = [];
            let score = 0;
            let dead = false;

            function resizeAstCanvas() {
                if (!canvas || !canvas.parentElement) return;
                const oldW = canvas.width || 380;
                const newW = canvas.parentElement.clientWidth || 380;
                const newH = canvas.parentElement.clientHeight || 320;
                canvas.width = newW;
                canvas.height = newH;
                shipX = Math.max(18, Math.min(newW - 18, (shipX / oldW) * newW));
            }

            window.moveAsteroidPlayer = function(dx) {
                shipX = Math.max(18, Math.min(canvas.width - 18, shipX + dx));
            };

            function onKey(e) {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') window.moveAsteroidPlayer(-24);
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') window.moveAsteroidPlayer(24);
            }

            window.addEventListener('keydown', onKey);
            window.addEventListener('resize', resizeAstCanvas);

            const loop = setInterval(() => {
                if (dead) return;
                if (Math.random() < 0.14) {
                    asteroids.push({ x: 15 + Math.random() * (canvas.width - 30), y: -15, r: 10 + Math.random() * 10, vy: 3.5 + Math.random() * 3 });
                }
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#22d3ee';
                ctx.beginPath();
                ctx.moveTo(shipX, canvas.height - 34);
                ctx.lineTo(shipX - 14, canvas.height - 12);
                ctx.lineTo(shipX + 14, canvas.height - 12);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#f97316';
                asteroids.forEach(a => {
                    a.y += a.vy;
                    ctx.beginPath();
                    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                    ctx.fill();

                    const dist = Math.hypot(a.x - shipX, a.y - (canvas.height - 22));
                    if (dist < a.r + 11) {
                        dead = true;
                    }
                });

                asteroids = asteroids.filter(a => a.y < canvas.height + 25);
                score += 2;
                const scEl = document.getElementById('astScore');
                if (scEl) scEl.textContent = score;

                if (dead) {
                    clearInterval(loop);
                    ctx.fillStyle = 'rgba(2,6,23,0.82)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 18px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Tabrakan Meteor! Skor: ' + score, canvas.width / 2, canvas.height / 2);
                    if (score > 0) claimGameReward(game.id, score);
                }
            }, 35);

            document.getElementById('astResetBtn').onclick = () => {
                clearInterval(loop);
                initAsteroidGame(mount, game);
            };

            activeGameCleanup = () => {
                clearInterval(loop);
                window.removeEventListener('keydown', onKey);
                window.removeEventListener('resize', resizeAstCanvas);
            };
        }

            const modal = document.getElementById('checkoutModal');

                                <svg viewBox="0 0 120 120" class="w-48 h-48 mx-auto">
                                    <rect width="120" height="120" fill="#ffffff"/>
                                    <rect x="10" y="10" width="30" height="30" fill="none" stroke="#0f172a" stroke-width="6"/>

                                    <rect x="10" y="80" width="30" height="30" fill="none" stroke="#0f172a" stroke-width="6"/>
                                    <rect x="18" y="88" width="14" height="14" fill="#0f172a"/>

                    ` : `

            }, 1000);

        function confirmUserPayment(txId) {
            const user = getCurrentUser();
            if (!user) return;
            const cfg = state.topupConfig;
            const activeGame = state.games.find(g => g.id === ui.topupGameFilter) || state.games[0];
            const pkg = cfg.packages.find(p => p.id === ui.selectedPackageId) || cfg.packages.find(p => p.gameId === activeGame?.id);
            const pm = cfg.paymentMethods.find(m => m.id === ui.selectedMethodId) || cfg.paymentMethods[0];
            if (!activeGame || !pkg || !pm) return;

            const totalCoins = Number(pkg.coins) + Number(pkg.bonus || 0);
            const coinLabel = activeGame.coinName || ('Koin ' + activeGame.title);
            const mode = cfg.approvalMode;

            let status = 'pending';
            if (mode === 'auto') {
                status = 'success';
                if (!user.gameWallets) user.gameWallets = {};
                user.gameWallets[activeGame.id] = Number(user.gameWallets[activeGame.id] || 0) + totalCoins;
            } else if (mode === 'gateway') {
                status = 'awaiting_callback';
            }

            state.transactions.unshift({
                id: txId,
                userId: user.id,
                userName: user.name,
                gameId: activeGame.id,
                gameTitle: activeGame.title,
                coinName: coinLabel,
                packageName: pkg.name,
                coins: totalCoins,
                amount: pkg.price,
                methodName: pm.name,
                status,
                mode,
                createdAt: new Date().toLocaleString('id-ID')
            });

            saveState();
            closeCheckoutModal();

            if (status === 'success') {
                showToast(`Pembayaran terkonfirmasi! +${totalCoins} ${coinLabel} masuk ke dompet ${activeGame.title}.`, 'success');
            } else if (status === 'awaiting_callback') {
                showToast(`Invoice ${txId} dibuat & menunggu Webhook Callback dari ${cfg.paymentGateway.provider.toUpperCase()}.`, 'info');
            } else {
                showToast(`Konfirmasi terkirim! Pesanan ${txId} (${coinLabel}) menunggu verifikasi ACC Admin.`, 'info');
            }
            renderApp();
        }

        function markGatewayCallbackPaid(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx || tx.status === 'success') return;
            tx.status = 'success';
            const user = state.users.find(u => u.id === tx.userId);
            const targetGameId = tx.gameId || state.games[0]?.id;
            if (user && targetGameId) {
                if (!user.gameWallets) user.gameWallets = {};
                user.gameWallets[targetGameId] = Number(user.gameWallets[targetGameId] || 0) + Number(tx.coins || 0);
            }
            saveState();
            showToast(`Pembayaran gateway ${txId} dikonfirmasi! +${tx.coins} ${tx.coinName || 'Koin'} ditambahkan.`, 'success');
            renderApp();
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            ensurePerGameWalletsAndPackages(state);
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPass').value.trim();
            let user = state.users.find(u => u && String(u.email || '').trim().toLowerCase() === email && String(u.password || '').trim() === pass);
            if (!user && email === 'admin@gamezone.id' && pass === 'admin123') {
                user = state.users.find(u => u && (u.role === 'admin' || u.id === 'u-admin'));
                if (user) {
                    user.email = 'admin@gamezone.id';
                    user.password = 'admin123';
                }
            }
            if (!user) {
                showToast('Email atau password tidak sesuai.', 'error');
                return;
            }
            state.currentUserId = user.id;
            user.presenceStatus = 'online';
            user.lastActiveAt = Date.now();
            saveState();
            closeAuthModal();
            showToast(`Selamat datang kembali, ${user.name}! Status: Online.`, 'success');
            renderApp();
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPass').value;
            if (state.users.some(u => u.email.toLowerCase() === email)) {
                showToast('Email tersebut sudah terdaftar.', 'error');
                return;
            }
            const initialWallets = {};
            state.games.forEach(g => { initialWallets[g.id] = 0; });

            const newUser = {
                id: 'u-' + Date.now(),
                name,
                email,
                password,
                role: 'user',
                gameWallets: initialWallets,
                bio: 'Pemain di portal GameZone ID.',
                favoriteGame: state.games[0]?.title || 'Neon Snake Cyber',
                avatarUrl: '',
                avatarIcon: 'fa-user-astronaut',
                avatarBg: 'from-cyan-500 to-blue-600',
                presenceStatus: 'online',
                lastActiveAt: Date.now()
            };
            state.users.push(newUser);
            state.currentUserId = newUser.id;
            saveState();
            closeAuthModal();
            showToast(`Akun ${name} berhasil dibuat!`, 'success');
            renderApp();
        }

        function handleForgotReset(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim().toLowerCase();

        let chatDragState = {
            bound: false,
            dragging: false,
            startClientX: 0,
            startClientY: 0,
            originX: 0,
            originY: 0
        };

        function getCanonicalChatRoomId(user, targetRoom) {
            if (targetRoom === 'global' || !user) return 'global';
            return 'dm-' + [user.id, targetRoom].sort().join('--');
        }

        function getDefaultChatBubblePos() {
            const footerEl = document.querySelector('footer');
            const bubbleHeight = 54;
            let defaultY = window.innerHeight - 154;
            if (footerEl) {
                const fRect = footerEl.getBoundingClientRect();
                if (fRect.top > 120 && fRect.top < window.innerHeight) {
                    defaultY = Math.min(defaultY, fRect.top - bubbleHeight - 14);
                }
            }
            return {
                x: 20,
                y: Math.max(80, defaultY)
            };
        }

        function clampChatBubblePos(x, y) {
            const bubbleEl = document.getElementById('chatFloatingBubble');
            const bw = bubbleEl ? bubbleEl.offsetWidth : 185;
            const bh = bubbleEl ? bubbleEl.offsetHeight : 54;
            const maxX = Math.max(12, window.innerWidth - bw - 12);
            const maxY = Math.max(76, window.innerHeight - bh - 12);
            return {
                x: Math.min(Math.max(12, x), maxX),
                y: Math.min(Math.max(76, y), maxY)
            };
        }

        function computeChatPanelCoords(bubblePos) {
            const isMobile = window.innerWidth < 640;
            if (isMobile) {
                return {
                    left: '12px',
                    right: '12px',
                    top: 'auto',
                    bottom: '84px'
                };
            }
            const panelWidth = 400;
            const onLeftSide = bubblePos.x < window.innerWidth / 2;
            const leftVal = onLeftSide
                ? Math.min(Math.max(16, bubblePos.x), window.innerWidth - panelWidth - 16) + 'px'
                : 'auto';
            const rightVal = !onLeftSide
                ? Math.min(Math.max(16, window.innerWidth - bubblePos.x - 185), window.innerWidth - panelWidth - 16) + 'px'
                : 'auto';

            const bubbleInUpperHalf = bubblePos.y < window.innerHeight * 0.42;
            if (bubbleInUpperHalf) {
                return {
                    left: leftVal,
                    right: rightVal,
                    top: Math.min(bubblePos.y + 64, window.innerHeight - 480) + 'px',
                    bottom: 'auto'
                };
            }
            const bottomOffset = Math.max(88, window.innerHeight - bubblePos.y + 12);
            return {
                left: leftVal,
                right: rightVal,
                top: 'auto',
                bottom: Math.min(bottomOffset, window.innerHeight - 460) + 'px'
            };
        }

        function bindChatBubbleDrag() {
            const bubble = document.getElementById('chatFloatingBubble');
            if (!bubble) return;

            const onPointerDown = (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                const point = e.touches ? e.touches[0] : e;
                chatDragState.dragging = true;
                ui.chatWasDragged = false;
                chatDragState.startClientX = point.clientX;
                chatDragState.startClientY = point.clientY;
                chatDragState.originX = ui.chatBubblePos.x;
                chatDragState.originY = ui.chatBubblePos.y;
                bubble.classList.add('scale-105', 'ring-2', 'ring-sky-400/60');
            };

            bubble.addEventListener('mousedown', onPointerDown);
            bubble.addEventListener('touchstart', onPointerDown, { passive: true });

            if (!chatDragState.bound) {
                chatDragState.bound = true;

                const onPointerMove = (e) => {
                    if (!chatDragState.dragging) return;
                    const point = e.touches ? e.touches[0] : e;
                    const dx = point.clientX - chatDragState.startClientX;
                    const dy = point.clientY - chatDragState.startClientY;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                        ui.chatWasDragged = true;
                    }
                    if (!ui.chatWasDragged) return;
                    if (e.cancelable) e.preventDefault();

                    const clamped = clampChatBubblePos(chatDragState.originX + dx, chatDragState.originY + dy);
                    ui.chatBubblePos = clamped;

                    const activeBubble = document.getElementById('chatFloatingBubble');
                    if (activeBubble) {
                        activeBubble.style.left = clamped.x + 'px';
                        activeBubble.style.top = clamped.y + 'px';
                    }

                    const panel = document.getElementById('chatFloatingPanel');
                    if (panel) {
                        const panelPos = computeChatPanelCoords(clamped);
                        panel.style.left = panelPos.left;
                        panel.style.right = panelPos.right;
                        panel.style.top = panelPos.top;
                        panel.style.bottom = panelPos.bottom;
                    }
                };

                const onPointerUp = () => {
                    if (!chatDragState.dragging) return;
                    chatDragState.dragging = false;
                    const activeBubble = document.getElementById('chatFloatingBubble');
                    if (activeBubble) {
                        activeBubble.classList.remove('scale-105', 'ring-2', 'ring-sky-400/60');
                    }
                    setTimeout(() => {
                        ui.chatWasDragged = false;
                    }, 60);
                };

                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('touchmove', onPointerMove, { passive: false });
                window.addEventListener('mouseup', onPointerUp);
                window.addEventListener('touchend', onPointerUp);
            }
        }

        function copyGameZoneSdkSnippet() {
            const openTag = '<' + 'script>';
            const closeTag = '</' + 'script>';
            const lines = [
                openTag,
                '// GameZone ID - GameBridge SDK (Auto-Detect Item, Koin & Skor)',
                'window.GameZoneSDK = {',
                '  registerMeta: function(meta) {',
                '    window.parent.postMessage({ source: "GameZoneGame", type: "REGISTER_GAME_META", payload: meta }, "*");',
                '  },',
                '  reportScore: function(score) {',

        function handleGameThumbUpload(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            compressImageFile(file, 640, dataUrl => {
                ui.gameModalThumbData = dataUrl;
                const inp = document.getElementById('gmThumbUrl');
                if (inp) inp.value = dataUrl;
                updateGameModalPreview();
                showToast('Thumbnail berhasil diunggah!', 'success');
            });
        }

        function clearGameThumb() {
            ui.gameModalThumbData = '';

            if (inp) inp.value = '';
            updateGameModalPreview();
        }

        function updateGameModalPreview() {
            const box = document.getElementById('gameThumbPreviewBox');
            if (!box) return;
            const icon = document.getElementById('gmIcon')?.value || 'fa-gamepad';
            const grad = document.getElementById('gmGrad')?.value || 'from-indigo-600 to-purple-900';
            box.className = `h-32 w-full rounded-2xl overflow-hidden bg-gradient-to-br ${grad} flex items-center justify-center border border-slate-800`;
            if (ui.gameModalThumbData) {
                box.innerHTML = `<img src="${escapeHtml(ui.gameModalThumbData)}" class="w-full h-full object-cover">`;
            } else {
                box.innerHTML = `<i class="fa-solid ${escapeHtml(icon)} text-4xl text-white"></i>`;
            }
        }

        function extractEmbedUrlFromInput(raw) {
            const val = String(raw || '').trim();
            if (!val) return '';
            const match = val.match(/<iframe[^>]*\bsrc\s*=\s*["']([^"']+)["']/i);
            return match ? match[1].trim() : val;
        }

        function handleSaveGame(e, gameId) {
            e.preventDefault();
            const title = document.getElementById('gmTitle').value.trim();
            const category = document.getElementById('gmCat').value.trim();
            const coinName = document.getElementById('gmCoinName').value.trim() || ('Koin ' + title);
            const description = document.getElementById('gmDesc').value.trim();
            const coinReward = Number(document.getElementById('gmReward').value || 20);
            const playCost = Number(document.getElementById('gmPlayCost').value || 0);
            const icon = document.getElementById('gmIcon').value.trim() || 'fa-gamepad';
            const gradient = document.getElementById('gmGrad').value;
            const thumbnailUrl = document.getElementById('gmThumbUrl').value.trim();
            const embedEl = document.getElementById('gmEmbedUrl');
            const embedUrl = embedEl ? extractEmbedUrlFromInput(embedEl.value) : '';

            if (gameId) {
                const g = state.games.find(x => x.id === gameId);
                if (g) {
                    g.title = title;
                    g.category = category;
                    g.coinName = coinName;
                    g.description = description;
                    g.coinReward = coinReward;
                    g.playCost = playCost;
                    g.icon = icon;
                    g.gradient = gradient;
                    g.thumbnailUrl = thumbnailUrl;
                    if (g.type === 'embed') g.embedUrl = embedUrl;
                }
            } else {
                const newGameId = 'g-' + Date.now();
                const initCoins = Number(document.getElementById('gmInitPkgCoins')?.value || 100);
                const initPrice = Number(document.getElementById('gmInitPkgPrice')?.value || 10000);

                state.games.push({
                    id: newGameId,
                    title,
                    category,
                    coinName,
                    description,
                    coinReward,
                    playCost,
                    plays: 0,
                    featured: true,
                    type: embedUrl ? 'embed' : 'builtin',
                    builtinKey: 'snake',
                    embedUrl,
                    thumbnailUrl,
                    icon,
                    gradient
                });

                state.topupConfig.packages.push({
                    id: 'pkg-' + newGameId + '-1',
                    gameId: newGameId,
                    name: 'Starter ' + coinName,
                    coins: initCoins,
                    bonus: 15,
                    price: initPrice,
                    tag: 'Baru'
                });
            }

            ensurePerGameWalletsAndPackages(state);
            saveState();
            closeGameModal();
            showToast(`Game "${title}" & koin khusus "${coinName}" berhasil disimpan!`, 'success');
            renderApp();
        }

        function deleteGame(gameId) {
            if (state.games.length <= 1) {
                showToast('Minimal harus ada 1 game aktif.', 'warning');
                return;
            }
            state.games = state.games.filter(g => g.id !== gameId);
            state.topupConfig.packages = state.topupConfig.packages.filter(p => p.gameId !== gameId);
            saveState();
            showToast('Game & paket koin terkait berhasil dihapus.', 'info');
            renderApp();
        }

        function closeCustomPageModal() {
            const modal = document.getElementById('customPageModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function handleSaveCustomPage(e, cpId) {
            e.preventDefault();
            const title = document.getElementById('cpTitle').value.trim();
            const icon = document.getElementById('cpIcon').value.trim() || 'fa-file-lines';
            const content = document.getElementById('cpContent').value;
            const showInNav = document.getElementById('cpShowNav').checked;
            if (cpId) {
                const cp = state.customPages.find(x => x.id === cpId);
                if (cp) {
                    cp.title = title;
                    cp.icon = icon;
                    cp.content = content;
                    cp.showInNav = showInNav;
                }
            } else {
                state.customPages.push({
                    id: 'cp-' + Date.now(),
                    title,
                    slug: title.toLowerCase().replace(/\s+/g, '-'),
                    icon,
                    showInNav,
                    content
                });
            }
            saveState();
            closeCustomPageModal();
            showToast('Halaman kustom tersimpan!', 'success');
            renderApp();
        }

        function deleteCustomPage(cpId) {
            state.customPages = state.customPages.filter(x => x.id !== cpId);
            saveState();
            renderApp();
        }

        function updateInlinePackage(pkgId, field, value) {
            const pkg = state.topupConfig.packages.find(p => p.id === pkgId);
            if (!pkg) return;
            pkg[field] = value;
            saveState();
            showToast('Paket koin game diperbarui!', 'success');
        }

        function handleAddPaymentMethod(e) {
            e.preventDefault();
            const type = document.getElementById('newPmType').value;
            const name = document.getElementById('newPmName').value.trim();
            const accountInfo = document.getElementById('newPmAccount').value.trim();
            const accountHolder = document.getElementById('newPmHolder').value.trim();
            state.topupConfig.paymentMethods.push({
                id: 'pm-' + Date.now(),
                name,
                type,
                accountInfo,
                accountHolder,
                enabled: true
            });
            saveState();
            showToast(`Metode pembayaran "${name}" berhasil ditambahkan!`, 'success');
            renderApp();
        }

        function updatePaymentMethod(pmId, field, value) {
            const pm = state.topupConfig.paymentMethods.find(m => m.id === pmId);
            if (!pm) return;
            pm[field] = value;
            saveState();
            showToast('Metode pembayaran diperbarui!', 'success');
        }

        function deletePaymentMethod(pmId) {
            if (state.topupConfig.paymentMethods.length <= 1) {
                showToast('Minimal harus ada 1 metode pembayaran.', 'warning');
                return;
            }
            state.topupConfig.paymentMethods = state.topupConfig.paymentMethods.filter(m => m.id !== pmId);
            saveState();
            showToast('Metode pembayaran dihapus.', 'info');
            renderApp();
        }

        function handleQrisImageUpload(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            compressImageFile(file, 450, dataUrl => {
                state.topupConfig.qrisImageUrl = dataUrl;
                saveState();
                showToast('Gambar barcode QRIS merchant berhasil diunggah!', 'success');
                renderApp();
            });
        }

        function clearQrisImage() {
            state.topupConfig.qrisImageUrl = '';
            saveState();
            showToast('Gambar QRIS kustom dihapus, kembali menggunakan QRIS default.', 'info');
            renderApp();
        }

        function handleSaveTopupSettings(e) {
            e.preventDefault();
            const cfg = state.topupConfig;
            cfg.enabled = document.getElementById('tuEnabled').checked;
            cfg.approvalMode = document.getElementById('tuApprovalMode').value;
            cfg.qrisMerchantName = document.getElementById('tuQrisMerchant').value.trim();
            cfg.qrisDisplayEnabled = document.getElementById('tuQrisDisplay').checked;
            cfg.qrisNmid = document.getElementById('tuQrisNmid').value.trim();
            const qrisImgInput = document.getElementById('tuQrisImageUrl');
            if (qrisImgInput) cfg.qrisImageUrl = qrisImgInput.value.trim();

            cfg.paymentGateway = {
                ...cfg.paymentGateway,
                enabled: document.getElementById('pgEnabled').checked,
                provider: document.getElementById('pgProvider').value,
                environment: document.getElementById('pgEnv').value,
                merchantCode: document.getElementById('pgMerchant').value.trim(),
                apiKey: document.getElementById('pgApiKey').value.trim(),
                clientKey: document.getElementById('pgClientKey')?.value.trim() || cfg.paymentGateway.clientKey,
                secretKey: document.getElementById('pgSecretKey').value.trim(),
                callbackUrl: document.getElementById('pgCallbackUrl')?.value.trim() || cfg.paymentGateway.callbackUrl,
                returnUrl: document.getElementById('pgReturnUrl')?.value.trim() || cfg.paymentGateway.returnUrl,
                autoVerifyCallback: document.getElementById('pgAutoVerify')?.checked ?? true
            };

            saveState();
            showToast('Pengaturan Top-Up, QRIS & Payment Gateway disimpan!', 'success');
            renderApp();
        }

        function handleAddTopupPackage(e) {
            e.preventDefault();
            const gameId = document.getElementById('newPkgGameId').value;
            const name = document.getElementById('newPkgName').value.trim();
            const tag = document.getElementById('newPkgTag')?.value.trim() || 'Baru';
            const coins = Number(document.getElementById('newPkgCoins').value);
            const bonus = Number(document.getElementById('newPkgBonus').value || 0);
            const price = Number(document.getElementById('newPkgPrice').value);
            state.topupConfig.packages.push({
                id: 'pkg-' + Date.now(),
                gameId,
                name,
                coins,
                bonus,
                price,
                tag
            });
            ui.adminPkgGameFilter = gameId;
            saveState();
            showToast('Paket nominal koin khusus game berhasil ditambahkan!', 'success');
            renderApp();
        }

        function clearCompletedTransactions() {
            state.transactions = state.transactions.filter(t => t.status === 'pending' || t.status === 'awaiting_callback');
            saveState();
            showToast('Riwayat transaksi selesai telah dibersihkan.', 'info');
            renderApp();
        }

        function deleteTopupPackage(pkgId) {
            state.topupConfig.packages = state.topupConfig.packages.filter(p => p.id !== pkgId);
            saveState();
            renderApp();
        }

        function approveTransaction(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx || tx.status !== 'pending') return;
            tx.status = 'success';
            const user = state.users.find(u => u.id === tx.userId);
            const targetGameId = tx.gameId || state.games[0]?.id;
            if (user && targetGameId) {
                if (!user.gameWallets) user.gameWallets = {};
                user.gameWallets[targetGameId] = Number(user.gameWallets[targetGameId] || 0) + Number(tx.coins || 0);
            }
            saveState();
            showToast(`Top-Up ${txId} di-ACC! +${tx.coins} ${tx.coinName || 'Koin'} masuk ke dompet ${tx.gameTitle || 'Game'}.`, 'success');
            renderApp();
        }

        function rejectTransaction(txId) {
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx || tx.status !== 'pending') return;
            tx.status = 'rejected';
            saveState();
            showToast(`Top-Up ${txId} ditolak.`, 'warning');
            renderApp();
        }

                modal.classList.remove('flex');

            e.preventDefault();
            const u = state.users.find(x => x.id === userId);
            if (!u) return;
            u.name = document.getElementById('admUName').value.trim();
            u.email = document.getElementById('admUEmail').value.trim().toLowerCase();
            u.role = document.getElementById('admURole').value;
            const newPass = document.getElementById('admUPass').value.trim();
            if (newPass) u.password = newPass;

            if (!u.gameWallets) u.gameWallets = {};
            state.games.forEach(g => {
                const wInp = document.getElementById('admWallet_' + g.id);
                if (wInp) u.gameWallets[g.id] = Number(wInp.value || 0);
            });

            saveState();
            closeAdminUserModal();
            showToast(`Profil & dompet koin game milik ${u.name} diperbarui!`, 'success');
            renderApp();
