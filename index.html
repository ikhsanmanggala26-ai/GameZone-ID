                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tagline / Slogan</label>
                            <input id="siteTaglineInput" type="text" value="${escapeHtml(s.tagline)}" class="w-full rounded-xl bg-slate-950 border border-slate-800 px-3.5 py-2.5 text-sm text-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                            <div class="text-xs font-bold text-indigo-300">Logo Utama Header</div>
                            <div class="flex items-center gap-3">
                                ${renderBrandLogo('w-12 h-12')}
                                <div class="flex flex-wrap gap-2">
                                    <label class="cursor-pointer px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">
                                        <i class="fa-solid fa-upload mr-1"></i> Upload Logo
                                        <input type="file" accept="image/*" onchange="handleSiteLogoUpload(event)" class="hidden">
                                    </label>
                                    <button type="button" onclick="resetSiteLogoToMascot()" class="px-3 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-200">
                                        Maskot Elang
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                            <div class="text-xs font-bold text-amber-300">Favicon Tab Browser</div>
                            <div class="flex items-center gap-3">
                                <img src="${escapeHtml(s.faviconUrl || s.logoUrl || DEFAULT_EAGLE_FAVICON_URI)}" alt="Favicon" class="w-12 h-12 rounded-xl object-cover border border-slate-700 bg-slate-900">
                                <div class="flex flex-wrap gap-2">
                                    <label class="cursor-pointer px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold">
                                        <i class="fa-solid fa-upload mr-1"></i> Upload Favicon
                                        <input type="file" accept="image/*" onchange="handleSiteFaviconUpload(event)" class="hidden">
                                    </label>
                                    <button type="button" onclick="resetSiteFaviconToDefault()" class="px-3 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-200">
                                        Reset Default
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Palet Warna Tema</label>
                        <div class="flex flex-wrap gap-2.5">
                            ${themeKeys.map(k => `
                                <button type="button" onclick="selectSiteTheme('${k}')"
                                    class="px-4 py-2 rounded-xl border text-xs font-bold ${s.themeColor === k ? 'bg-white text-slate-950 border-white' : 'bg-slate-950 text-slate-300 border-slate-800'}">
                                    ${THEMES[k].name}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="p-4 rounded-2xl bg-slate-950 border border-teal-500/30 space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="text-xs font-extrabold text-teal-300"><i class="fa-solid fa-table mr-1"></i> Integrasi Database Google Apps Script & Google Sheets</div>
                            <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold ${s.appsScriptUrl ? 'bg-teal-500/20 text-teal-300' : 'bg-slate-800 text-slate-400'}">
                                ${s.appsScriptUrl ? 'Terpasang' : 'Belum Diatur'}
                            </span>
                        </div>
                        <p class="text-[11px] text-slate-400">Tempelkan <strong>Web App URL</strong> hasil deploy Google Apps Script (<code class="text-teal-300">https://script.google.com/macros/s/.../exec</code>) untuk menyimpan akun, dompet koin game, transaksi Top-Up, dan chat langsung ke Google Sheets.</p>
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input id="siteAppsScriptUrlInput" type="url" value="${escapeHtml(s.appsScriptUrl || '')}"
                                placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                                class="flex-1 rounded-xl bg-slate-900 border border-slate-800 px-3.5 py-2 text-xs font-mono text-white">
                            <button type="button" onclick="testAndSyncAppsScript()" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold shrink-0">
                                <i class="fa-solid fa-rotate mr-1"></i> Uji & Sinkron Sekarang
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-slate-800">
                        <label class="flex items-center gap-2 text-xs font-bold text-slate-200">
                            <input id="siteChatEnabled" type="checkbox" ${s.chatEnabled ? 'checked' : ''}>
                            <span>Aktifkan Telegram Chat Overlay</span>
                        </label>
                        <div class="flex items-center gap-3">
                            <button type="button" onclick="resetAllDataToDefault()" class="px-4 py-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-bold">
                                Reset Data Awal
                            </button>
                            <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold">
                                Simpan Pengaturan Website
                            </button>
                        </div>
                    </div>
                </form>
            `;
        }

        function handleSiteLogoUpload(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            compressImageFile(file, 256, dataUrl => {
                state.siteSettings.logoUrl = dataUrl;
                saveState();
                showToast('Logo website berhasil diunggah!', 'success');
                renderApp();
            });
        }

        function resetSiteLogoToMascot() {
            state.siteSettings.logoUrl = '';
            state.siteSettings.logoIcon = 'eagle-mascot';
            saveState();
            showToast('Logo dikembalikan ke Maskot Elang Gaming!', 'info');
            renderApp();
        }

        function handleSiteFaviconUpload(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            compressImageFile(file, 128, dataUrl => {
                state.siteSettings.faviconUrl = dataUrl;
                saveState();
                applyFavicon();
                showToast('Favicon browser berhasil diperbarui!', 'success');
                renderApp();
            });
        }

        function resetSiteFaviconToDefault() {
            state.siteSettings.faviconUrl = '';
            saveState();
            applyFavicon();
            showToast('Favicon dikembalikan ke default!', 'info');
            renderApp();
        }

        function selectSiteTheme(themeKey) {
            state.siteSettings.themeColor = themeKey;
            saveState();
            renderApp();
        }

        function handleSaveSiteSettings(e) {
            e.preventDefault();
            state.siteSettings.siteName = document.getElementById('siteNameInput').value.trim();
            state.siteSettings.tagline = document.getElementById('siteTaglineInput').value.trim();
            state.siteSettings.chatEnabled = document.getElementById('siteChatEnabled').checked;
            const scriptInp = document.getElementById('siteAppsScriptUrlInput');
            if (scriptInp) {
                state.siteSettings.appsScriptUrl = scriptInp.value.trim();
            }
            saveState();
            if (window.AppsScriptBackend) {
                window.AppsScriptBackend.start();
                window.AppsScriptBackend.pushStateNow();
            }
            showToast('Pengaturan website, tema & Google Apps Script berhasil disimpan!', 'success');
            renderApp();
        }

        function testAndSyncAppsScript() {
            const scriptInp = document.getElementById('siteAppsScriptUrlInput');
            const url = scriptInp ? scriptInp.value.trim() : '';
            if (!url || !url.startsWith('https://script.google.com/')) {
                showToast('Masukkan URL Web App Google Apps Script yang valid terlebih dahulu.', 'warning');
                return;
            }
            state.siteSettings.appsScriptUrl = url;
            saveState();
            if (window.AppsScriptBackend) {
                window.AppsScriptBackend.start();
                window.AppsScriptBackend.pushStateNow();
                window.AppsScriptBackend.pullNow(false);
            }
            renderApp();
        }

        function resetAllDataToDefault() {
            localStorage.removeItem(STORAGE_KEY);
            state = createDefaultState();
            ensurePerGameWalletsAndPackages(state);
            window.state = state;
            saveState();
            showToast('Seluruh data portal dikembalikan ke pengaturan awal.', 'info');
            navigateTo('home');
        }

        // =========================================================================
        // 14. LISTENER GLOBAL (GAMEBRIDGE SDK, SHIFT + TAB & PELACAKAN AKTIVITAS)
        // =========================================================================
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || data.source !== 'GameZoneGame') return;

            const activeGame = state.games.find(g => g.id === ui.activeGameId);
            if (!activeGame) return;

            if (data.type === 'REGISTER_GAME_META' && data.payload) {
                const meta = data.payload;
                let updated = false;
                if (meta.coinName && typeof meta.coinName === 'string' && activeGame.coinName !== meta.coinName.trim()) {
                    activeGame.coinName = meta.coinName.trim();
                    updated = true;
                }
                if (Array.isArray(meta.items)) {
                    activeGame.detectedItems = meta.items.map((it, idx) => ({
                        id: String(it.id || ('item-' + idx)),
                        name: String(it.name || ('Item #' + (idx + 1))),
                        price: Number(it.price || 0),
                        description: String(it.description || '')
                    }));
                    updated = true;
                }
                if (updated) {
                    ensurePerGameWalletsAndPackages(state);
                    saveState();
                    showToast(`SDK terdeteksi: ${activeGame.detectedItems?.length || 0} item dari "${activeGame.title}" dimuat otomatis!`, 'success');
                    if (ui.currentPage === 'play') renderApp();
                }
            } else if (data.type === 'REPORT_SCORE' && typeof data.score === 'number') {
                claimGameReward(activeGame.id, data.score);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'Tab') {
                e.preventDefault();
                toggleChatOverlay();
            }
            recordUserActivity();
        });

        ['click', 'mousemove', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, recordUserActivity, { passive: true });
        });

        window.addEventListener('resize', () => {
            if (document.getElementById('chatFloatingBubble')) {
                renderChatOverlay();
            }
        });

        // Inisialisasi aplikasi saat pertama kali dimuat
        window.renderApp = renderApp;
        syncAllUsersPresence();
        portalIdleCheckInterval = setInterval(checkPortalIdleStatus, 15000);
        if (window.AppsScriptBackend) window.AppsScriptBackend.start();
        renderApp();
    </script>
</body>
</html>
